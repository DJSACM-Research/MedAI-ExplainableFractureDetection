services:
  streamlit:
    build: .
    container_name: fracture-detection-app
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=host.docker.internal:11434
    volumes:
      - ./outputs:/app/outputs:ro
      - ./data:/app/data:ro
    networks:
      - fracture-net
    restart: unless-stopped

  # Optional: Uncomment to run Ollama in Docker instead of host machine
  # Make sure to comment out OLLAMA_HOST env var above if using this
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama-server
  #   ports:
  #     - "11434:11434"
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - fracture-net
  #   restart: unless-stopped

# volumes:
#   ollama_data:

networks:
  fracture-net:
    driver: bridge
