[pytest]
# Pytest configuration for MedAI Explainable Fracture Detection tests

# Minimum Python version
minversion = 3.8

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for agent workflows
    diagnostic: Tests for diagnostic agent
    educational: Tests for educational agent
    explainability: Tests for explainability agent
    knowledge: Tests for knowledge agent
    ensemble: Tests for cross-validation/ensemble agent
    slow: Tests that take significant time to run
    requires_gpu: Tests that require GPU (will be skipped on CPU-only systems)

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=src/agents --cov-report=html --cov-report=term-missing

# Ignore files
norecursedirs = .git __pycache__ *.egg-info .pytest_cache venv

# Timeout for tests (if using pytest-timeout)
# timeout = 300
